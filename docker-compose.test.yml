# Run standalone: docker compose -f docker-compose.test.yml run --rm tests
# Supply TEST_DATABASE_URL and TEST_POSTGRES_PASSWORD explicitly in the environment.
# URL: postgresql+psycopg2://med_test:<URL-encoded-password>@db-test:5432/med_test
name: med-app-tests

services:
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: med_test
      POSTGRES_DB: med_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test-only]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U med_test -d med_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  tests:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app:ro
    environment:
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:?Set TEST_DATABASE_URL explicitly}
      PYTHONDONTWRITEBYTECODE: "1"
    command: >-
      sh -c "pip install --no-cache-dir -r requirements-test.txt && python -m pytest"
    networks: [test-only]
    depends_on:
      db-test:
        condition: service_healthy

networks:
  test-only:
